[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-agent"
version = "1.0.0"
description = "FLOW--a data-analysis agent with a web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FLOW contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "flowio>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
analysis = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "flowkit>=1.2",
]

[project.scripts]
flow = "flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow = [
    "env/kernel_server.py",
    "firstrun/*.py",
    "firstrun/first_run.R",
    # Anchored first-run pipeline: ship its source AND its data file. fcs_io.py reads
    # upn18_operator_anchor.json at import time, and provision_anchored copies the whole
    # package into a project — both need these present in the installed/built package.
    "firstrun/anchored/*.py",
    "firstrun/anchored/*.json",
    # Cutoff diagnostics subpackage. provision_anchored copies the whole anchored/ tree into a
    # project, so this must ship with it or `import anchored.diagnostics` fails in the sandbox.
    "firstrun/anchored/diagnostics/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
